<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himani R</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#1a1a1a;
    --muted:#6b6b6b;
    --accent:#2f5233;
    --link:#3a6ea5;
    --border:#e5e5e5;
    --navbg:#f5f5f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--text);
    background:var(--bg);
    line-height:1.65;
    font-size:16px;
  }

  /* NAV */
  nav{
    background:var(--navbg);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:10;
  }
  nav .nav-inner{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 40px; flex-wrap:wrap; gap:12px;
  }
  nav .brand{font-weight:700; font-size:18px; letter-spacing:-0.2px;}
  .nav-right{display:flex; align-items:center; gap:28px; flex-wrap:wrap;}
  .nav-right button{
    all:unset; cursor:pointer;
    color:var(--link); font-size:13px; letter-spacing:0.5px; font-weight:600;
    text-transform:uppercase;
    padding:4px 2px; border-bottom:2px solid transparent;
  }
  .nav-right button:hover{color:var(--accent);}
  .nav-right button.active{color:var(--accent); border-bottom:2px solid var(--accent);}
  .menu-toggle{display:none; all:unset; cursor:pointer; font-size:20px;}

  /* LAYOUT */
  .layout{
    display:flex; gap:56px; max-width:1100px; margin:0 auto;
    padding:48px 40px; align-items:flex-start; flex-wrap:wrap;
  }

  /* LEFT COLUMN (persistent) */
  .left-col{width:225px; flex-shrink:0;}
  .photo{
    width:225px; height:280px; border-radius:6px; overflow:hidden;
    background:#eee; margin-bottom:22px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:44px; font-weight:700;
  }
  .photo img{width:100%; height:100%; object-fit:cover;}
  .left-block{margin-bottom:22px;}
  .left-block h4{font-size:13px; font-weight:700; margin-bottom:6px;}
  .left-block a, .left-block span{font-size:13.5px; color:var(--link); text-decoration:none; display:block;}
  .left-block a:hover{text-decoration:underline;}
  .left-block .plain{color:var(--muted);}

  /* RIGHT / MAIN CONTENT */
  .main{flex:1; min-width:280px;}
  .page{display:none;}
  .page.active{display:block;}

  h1{font-size:26px; font-weight:700; margin-bottom:20px;}
  h2.section-heading{font-size:17px; font-weight:700; margin-top:26px; margin-bottom:10px;}
  h3.sub-heading{font-size:14.5px; font-weight:700; margin-top:16px; margin-bottom:8px; color:#333;}
  p{color:#333; margin-bottom:14px; max-width:640px;}
  ul.bullets{list-style:disc; padding-left:20px; margin-bottom:8px;}
  ul.bullets li{margin-bottom:8px; color:#333; font-size:15px;}

  .home-tagline{color:var(--muted); font-size:16px; margin-bottom:16px;}

  .item{margin-bottom:26px; padding-bottom:26px; border-bottom:1px solid var(--border); max-width:640px;}
  .item:last-child{border-bottom:none;}
  .item .meta{color:var(--muted); font-size:13.5px; margin-bottom:6px;}
  .item .desc{color:#444; font-size:14.5px; margin-top:6px;}
  .item .links{margin-top:8px;}
  .item .links a{font-size:13.5px; color:var(--link); text-decoration:none; margin-right:14px;}
  .item .links a:hover{text-decoration:underline;}

  .cv-box{
    border:1px solid var(--border); border-radius:8px; padding:20px; max-width:640px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .btn{
    display:inline-block; background:var(--accent); color:#fff !important;
    padding:9px 16px; border-radius:6px; text-decoration:none; font-size:14px; font-weight:500;
  }
  .btn:hover{opacity:0.9;}
  .btn.secondary{background:none; color:var(--accent) !important; border:1px solid var(--accent);}

  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px; margin-bottom:30px; max-width:640px;
  }
  .gallery-cell{
    border:1px solid var(--border); border-radius:6px; overflow:hidden;
    background:#fafafa;
  }
  .gallery-cell img{width:100%; height:130px; object-fit:cover; display:block;}
  .gallery-placeholder{
    width:100%; height:130px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; background:#f0f0ef;
  }
  .gallery-caption{padding:6px 8px; font-size:12.5px; color:var(--muted);}

  .contact-list{list-style:none; max-width:400px;}
  .contact-list li{margin-bottom:10px; font-size:15px;}
  .contact-list a{color:var(--link); text-decoration:none;}
  .contact-list a:hover{text-decoration:underline;}
  .contact-list .label{color:var(--muted); display:inline-block; width:90px;}

  footer{
    text-align:left; color:var(--muted); font-size:12.5px;
    padding-top:10px;
  }
  footer a{color:var(--muted);}

  @media (max-width:760px){
    .layout{flex-direction:column; padding:32px 22px;}
    .left-col{width:100%;}
    .photo{width:160px; height:200px;}
    .nav-right{
      display:none; width:100%; flex-direction:column; align-items:flex-start; gap:12px;
      padding-top:10px; border-top:1px solid var(--border);
    }
    .nav-right.open{display:flex;}
    .menu-toggle{display:block;}
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="brand" id="nav-name">Himani R</div>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <div class="nav-right" id="nav-right">
      <button data-page="home" class="active">Home</button>
      <button data-page="about">About Me</button>
      <button data-page="research">Research</button>
      <button data-page="teaching">Teaching</button>
      <button data-page="projects">Projects</button>
      <button data-page="gallery">Gallery</button>
      <button data-page="cv">CV</button>
      <button data-page="contact">Contact</button>
    </div>
  </div>
</nav>

<div class="layout">

  <!-- LEFT COLUMN: persistent across all pages -->
  <div class="left-col">
    <div class="photo" id="photo"></div>

    <div class="left-block" id="left-contact-block">
      <h4>Contact</h4>
      <a id="left-email" href="#"></a>
    </div>

    <div class="left-block" id="left-links-block"></div>

    <div class="left-block">
      <h4>CV</h4>
      <a href="#" id="left-cv-link">Curriculum Vitae</a>
    </div>

    <footer>Hosted on GitHub Pages</footer>
  </div>

  <!-- RIGHT: page content -->
  <div class="main">

    <section class="page active" id="page-home">
      <h1 id="home-name">Himani R</h1>
      <p class="home-tagline" id="home-tagline"></p>
      <p id="home-intro"></p>
    </section>

    <section class="page" id="page-about">
      <h1>About Me</h1>
      <div id="about-content"></div>
    </section>

    <section class="page" id="page-research">
      <h1>Research Papers &amp; Blog</h1>
      <div id="research-list"></div>
    </section>

    <section class="page" id="page-teaching">
      <h1>Teaching</h1>
      <div id="teaching-list"></div>
    </section>

    <section class="page" id="page-projects">
      <h1>Projects</h1>
      <div id="projects-list"></div>
    </section>

    <section class="page" id="page-gallery">
      <h1>Gallery</h1>
      <div id="gallery-list"></div>
    </section>

    <section class="page" id="page-cv">
      <h1>Curriculum Vitae</h1>
      <div class="cv-box">
        <div>
          <h3 style="margin-bottom:4px; font-size:16px;">View or download my full CV</h3>
          <p style="color:var(--muted); font-size:14px; margin-bottom:0;" id="cv-updated">Last updated: —</p>
        </div>
        <div>
          <a class="btn" id="cv-view-btn" href="#" target="_blank" rel="noopener">View CV</a>
          <a class="btn secondary" id="cv-download-btn" href="#" download>Download</a>
        </div>
      </div>
    </section>

    <section class="page" id="page-contact">
      <h1>Contact</h1>
      <ul class="contact-list" id="contact-list"></ul>
    </section>

  </div>
</div>

<script>
/* ============================================================
   EDIT EVERYTHING BELOW THIS LINE.
   This is the ONLY section you need to touch to update your site.
   Do not edit anything below the "DO NOT EDIT" marker.
   ============================================================ */

const CONFIG = {

  // ---- Basic info ----
  name: "Himani R",
  tagline: "Teacher / Researcher",
  intro: "Hello! I'm Himani — a literature student, aspiring researcher, and someone who finds magic in words. I believe in the transformative power of education and storytelling. I am deeply interested in understanding people — their behaviour, identities, beliefs, and personal growth. History interests me through the people who shaped it, literature through its characters, and psychology through its study of human behaviour.",

  // ---- Profile photo ----
  // Upload an image (e.g. photo.jpg) to your GitHub repo, same folder as
  // index.html, then put its exact filename here. Leave "" for a placeholder.
  photoFile: "photo.jpg",

  // ---- Left-column contact & links ----
  email: "himaniramesh2004@gmail.com",
  leftLinks: [
    { label: "GitHub", value: "himaniofficial", url: "https://github.com/himaniofficial" },
    { label: "Youtube", value: "Channel", url: "https://youtube.com/@paatshala.byhimani?si=t2dssifNktR70aiM" },
    { label: "Linkedin", value: "View Profile", url: "https://www.linkedin.com/in/himaniofficial?utm_source=share_via&utm_content=profile&utm_medium=member_android" }
  ],

  // ---- About Me ----
  // Build this like a real page: mix paragraphs, section headings,
  // sub-headings, and bullet lists, in any order, by adding blocks below.
  //
  // Block types you can use:
  //   { type: "paragraph", text: "..." }
  //   { type: "heading", text: "Education" }          <- big section title
  //   { type: "subheading", text: "University Name" } <- smaller title under a heading
  //   { type: "list", items: ["...", "...", "..."] }  <- bullet points
  about: [
    { type: "paragraph", text: "Himani currently works as a kindergarten teacher in India. She comes from a traditional Marwari family but chooses to question blind traditions and customs. An intersectional feminist who believes in equality and women's rights, she takes great pride in persistence, diligence, empathy, and lifelong learning. She loves public speaking and has hosted many academic and cultural events. She also enjoys acting on stage and has performed different roles in skits and dramas." },
    { type: "heading", text: "Education" },
    { type: "subheading", text: "Sacred Heart College" },
    { type: "list", items: [
      "Master's in English (2024 - 2026)",
      "CGPA: 8.5/10 (First Class with Distinction)"
    ]},
    { type: "subheading", text: "Jain College" },
    { type: "list", items: [
      "Bachelor's in English (2021 - 2024)",
      "CGPA: 7.6/10 (First Class)"
    ]}
  ],

  // ---- Research Papers & Blog ----
  research: [
    {
      title: "Working Until the End: A Neo-Marxist Perspective on Pandemic Literature Through the Lens of Ling Ma's Severance",
      meta: "Oct, 2026",
      description: "One or two sentence summary of what this paper is about.",
      links: [
        { label: "PDF", url: "" },
        { label: "Blog Post", url: "" }
      ]
    },
    {
      title: "The Thematic Analysis on thr Journey to Adulthood in Ruskin Bond's The Room on the Roof",
      meta: "Apr, 2024",
      description: "Short description of the paper's contribution.",
      links: [
        { label: "arXiv", url: "" }
      ]
    }
  ],

  // ---- Teaching ----
  teaching: [
    {
      title: "Storytelling & Theatre Program",
      meta: "Kindergarten Teacher — Springdays CBSE & Cambridge, 2026",
      description: "Brief note on your role and what you taught."
    },
    {
      title: "English Language Training",
      meta: "Language Instructor — Naan Mudhalvan Springboards, 2025",
      description: "Brief note about the course or your contribution."
    }
  ],

  // ---- Projects ----
  // Same format as Research/Teaching. Links are optional — leave url: "" to hide a link.
  projects: [
    {
      title: "Penny Wise (Educational Publishing Project)",
      meta: "Founder, 2026",
      description: "Designing and developing storytelling books, coloring books, and activity books for children",
      links: [
        { label: "GitHub", url: "" },
        { label: "Live Demo", url: "" }
      ]
    }
  ],

  // ---- Gallery ----
  // Grouped by category. Each category has a name and a list of images.
  // For each image: set "src" to an image URL/filename once you have it
  // (leave "" for now to show a placeholder box), and "caption" is optional.
  gallery: [
    {
      category: "Category Name Here",
      images: [
        { src: "", caption: "" },
        { src: "", caption: "" },
        { src: "", caption: "" }
      ]
    },
    {
      category: "Another Category",
      images: [
        { src: "", caption: "" },
        { src: "", caption: "" }
      ]
    }
  ],

  // ---- CV ----
  // Upload a cv.pdf to your GitHub repo (same folder as index.html)
  // and keep this filename matching it.
  cv: {
    fileUrl: "https://drive.google.com/file/d/1CIU3do_MvjgScFNGELz8vBjNRYk0hnLX/view?usp=drivesdk",
    lastUpdated: "July 2026"
  },

  // ---- Contact page ----
  contact: [
    { label: "Email", value: "himaniramesh2004@gmail.com", url: "mailto:you@email.com" },
    { label: "Contact", value: "+91 - 9943271681" }
  ]
};

/* ============================================================
   DO NOT EDIT BELOW THIS LINE
   (rendering logic — safe to ignore)
   ============================================================ */

document.title = CONFIG.name;
document.getElementById('nav-name').textContent = CONFIG.name;
document.getElementById('home-name').textContent = CONFIG.name;
document.getElementById('home-tagline').textContent = CONFIG.tagline;
document.getElementById('home-intro').textContent = CONFIG.intro;

// Photo
const photoEl = document.getElementById('photo');
if (CONFIG.photoFile && CONFIG.photoFile.trim() !== "") {
  const img = document.createElement('img');
  img.src = CONFIG.photoFile;
  img.alt = CONFIG.name;
  photoEl.appendChild(img);
} else {
  const initials = CONFIG.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  photoEl.textContent = initials;
}

// Left column: email + links
document.getElementById('left-email').textContent = CONFIG.email;
document.getElementById('left-email').href = "mailto:" + CONFIG.email;

const leftLinksBlock = document.getElementById('left-links-block');
CONFIG.leftLinks.forEach(l => {
  const h4 = document.createElement('h4');
  h4.textContent = l.label;
  const a = document.createElement('a');
  a.href = l.url; a.textContent = l.value; a.target = "_blank"; a.rel = "noopener";
  leftLinksBlock.appendChild(h4);
  leftLinksBlock.appendChild(a);
});

document.getElementById('left-cv-link').href = CONFIG.cv.fileUrl;

// About (block-based renderer)
const aboutEl = document.getElementById('about-content');
CONFIG.about.forEach(block => {
  if (block.type === "paragraph") {
    const p = document.createElement('p');
    p.textContent = block.text;
    aboutEl.appendChild(p);
  } else if (block.type === "heading") {
    const h = document.createElement('h2');
    h.className = "section-heading";
    h.textContent = block.text;
    aboutEl.appendChild(h);
  } else if (block.type === "subheading") {
    const h = document.createElement('h3');
    h.className = "sub-heading";
    h.textContent = block.text;
    aboutEl.appendChild(h);
  } else if (block.type === "list") {
    const ul = document.createElement('ul');
    ul.className = "bullets";
    block.items.forEach(it => {
      const li = document.createElement('li');
      li.textContent = it;
      ul.appendChild(li);
    });
    aboutEl.appendChild(ul);
  }
});

// Research
const researchEl = document.getElementById('research-list');
CONFIG.research.forEach(r => {
  const div = document.createElement('div');
  div.className = 'item';
  const linksHtml = (r.links || [])
    .filter(l => l.url && l.url.trim() !== "")
    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
    .join('');
  div.innerHTML = `
    <h3 style="font-size:16px; font-weight:700; margin-bottom:4px;">${r.title}</h3>
    <div class="meta">${r.meta}</div>
    <div class="desc">${r.description}</div>
    ${linksHtml ? `<div class="links">${linksHtml}</div>` : ''}
  `;
  researchEl.appendChild(div);
});

// Teaching
const teachingEl = document.getElementById('teaching-list');
CONFIG.teaching.forEach(t => {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `
    <h3 style="font-size:16px; font-weight:700; margin-bottom:4px;">${t.title}</h3>
    <div class="meta">${t.meta}</div>
    <div class="desc">${t.description}</div>
  `;
  teachingEl.appendChild(div);
});

// Projects
const projectsEl = document.getElementById('projects-list');
CONFIG.projects.forEach(p => {
  const div = document.createElement('div');
  div.className = 'item';
  const linksHtml = (p.links || [])
    .filter(l => l.url && l.url.trim() !== "")
    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
    .join('');
  div.innerHTML = `
    <h3 style="font-size:16px; font-weight:700; margin-bottom:4px;">${p.title}</h3>
    <div class="meta">${p.meta}</div>
    <div class="desc">${p.description}</div>
    ${linksHtml ? `<div class="links">${linksHtml}</div>` : ''}
  `;
  projectsEl.appendChild(div);
});

// Gallery (grouped by category)
const galleryEl = document.getElementById('gallery-list');
CONFIG.gallery.forEach(group => {
  const heading = document.createElement('h2');
  heading.className = 'section-heading';
  heading.textContent = group.category;
  galleryEl.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'gallery-grid';
  group.images.forEach(img => {
    const cell = document.createElement('div');
    cell.className = 'gallery-cell';
    if (img.src && img.src.trim() !== "") {
      cell.innerHTML = `<img src="${img.src}" alt="${img.caption || group.category}">`;
    } else {
      cell.innerHTML = `<div class="gallery-placeholder">Image</div>`;
    }
    if (img.caption && img.caption.trim() !== "") {
      const cap = document.createElement('div');
      cap.className = 'gallery-caption';
      cap.textContent = img.caption;
      cell.appendChild(cap);
    }
    grid.appendChild(cell);
  });
  galleryEl.appendChild(grid);
});

// CV page
document.getElementById('cv-view-btn').href = CONFIG.cv.fileUrl;
document.getElementById('cv-download-btn').href = CONFIG.cv.fileUrl;
document.getElementById('cv-updated').textContent = "Last updated: " + CONFIG.cv.lastUpdated;

// Contact page
const contactEl = document.getElementById('contact-list');
CONFIG.contact.forEach(c => {
  const li = document.createElement('li');
  if (c.url && c.url.trim() !== "") {
    li.innerHTML = `<span class="label">${c.label}</span><a href="${c.url}" target="_blank" rel="noopener">${c.value}</a>`;
  } else {
    li.innerHTML = `<span class="label">${c.label}</span>${c.value}`;
  }
  contactEl.appendChild(li);
});

// Page navigation
const navButtons = document.querySelectorAll('.nav-right button');
const pages = document.querySelectorAll('.page');
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-page');
    pages.forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + target).classList.add('active');
    navButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('nav-right').classList.remove('open');
    window.scrollTo(0,0);
  });
});

// Mobile menu toggle
document.getElementById('menu-toggle').addEventListener('click', () => {
  document.getElementById('nav-right').classList.toggle('open');
});
</script>

</body>
</html>
