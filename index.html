<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himani R</title>

<style>
  :root{
    --bg:#ffffff;
    --text:#1a1a1a;
    --muted:#6b6b6b;
    --accent:#2f5233;
    --link:#3a6ea5;
    --border:#e5e5e5;
    --navbg:#f5f5f4;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    line-height:1.65;
    font-size:16px;
  }

  /* NAV */
  nav{
    background:var(--navbg);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }

  nav .nav-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    flex-wrap:wrap;
    gap:12px;
  }

  nav .brand{
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.2px;
  }

  .nav-right{
    display:flex;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
  }

  .nav-right button{
    all:unset;
    cursor:pointer;
    color:var(--link);
    font-size:13px;
    letter-spacing:0.5px;
    font-weight:600;
    text-transform:uppercase;
    padding:4px 2px;
    border-bottom:2px solid transparent;
  }

  .nav-right button:hover{color:var(--accent);}

  .nav-right button.active{
    color:var(--accent);
    border-bottom:2px solid var(--accent);
  }

  .menu-toggle{
    display:none;
    all:unset;
    cursor:pointer;
    font-size:20px;
  }

  /* LAYOUT */
  .layout{
    display:flex;
    gap:56px;
    max-width:1100px;
    margin:0 auto;
    padding:48px 40px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  /* LEFT COLUMN */
  .left-col{
    width:225px;
    flex-shrink:0;
  }

  .photo{
    width:225px;
    height:280px;
    border-radius:6px;
    overflow:hidden;
    background:#eee;
    margin-bottom:22px;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-size:44px;
    font-weight:700;
  }

  .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .left-block{
    margin-bottom:22px;
  }

  .left-block h4{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
  }

  .left-block a,
  .left-block span{
    font-size:13.5px;
    color:var(--link);
    text-decoration:none;
    display:block;
  }

  .left-block a:hover{text-decoration:underline;}

  .left-block .plain{color:var(--muted);}

  /* MAIN CONTENT */
  .main{
    flex:1;
    min-width:280px;
  }

  .page{display:none;}

  .page.active{display:block;}

  h1{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
  }

  h2.section-heading{
    font-size:17px;
    font-weight:700;
    margin-top:26px;
    margin-bottom:10px;
  }

  h3.sub-heading{
    font-size:14.5px;
    font-weight:700;
    margin-top:16px;
    margin-bottom:8px;
    color:#333;
  }

  p{
    color:#333;
    margin-bottom:14px;
    max-width:640px;
  }

  ul.bullets{
    list-style:disc;
    padding-left:20px;
    margin-bottom:8px;
  }

  ul.bullets li{
    margin-bottom:8px;
    color:#333;
    font-size:15px;
  }

  .home-tagline{
    color:var(--muted);
    font-size:16px;
    margin-bottom:16px;
  }

  .item{
    margin-bottom:26px;
    padding-bottom:26px;
    border-bottom:1px solid var(--border);
    max-width:640px;
  }

  .item:last-child{border-bottom:none;}

  .item .meta{
    color:var(--muted);
    font-size:13.5px;
    margin-bottom:6px;
  }

  .item .desc{
    color:#444;
    font-size:14.5px;
    margin-top:6px;
  }

  .item .links{margin-top:8px;}

  .item .links a{
    font-size:13.5px;
    color:var(--link);
    text-decoration:none;
    margin-right:14px;
  }

  .item .links a:hover{text-decoration:underline;}

  .cv-box{
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }

  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff !important;
    padding:9px 16px;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
  }

  .btn:hover{opacity:0.9;}

  .btn.secondary{
    background:none;
    color:var(--accent) !important;
    border:1px solid var(--accent);
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    margin-bottom:30px;
    max-width:640px;
  }

  .gallery-cell{
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    background:#fafafa;
  }

  .gallery-cell img{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }

  .gallery-placeholder{
    width:100%;
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:13px;
    background:#f0f0ef;
  }

  .gallery-caption{
    padding:6px 8px;
    font-size:12.5px;
    color:var(--muted);
  }

  .contact-list{
    list-style:none;
    max-width:400px;
  }

  .contact-list li{
    margin-bottom:10px;
    font-size:15px;
  }

  .contact-list a{
    color:var(--link);
    text-decoration:none;
  }

  .contact-list a:hover{text-decoration:underline;}

  .contact-list .label{
    color:var(--muted);
    display:inline-block;
    width:90px;
  }

  footer{
    text-align:left;
    color:var(--muted);
    font-size:12.5px;
    padding-top:10px;
  }

  footer a{color:var(--muted);}

  @media (max-width:760px){
    .layout{
      flex-direction:column;
      padding:32px 22px;
    }

    .left-col{width:100%;}

    .photo{
      width:160px;
      height:200px;
    }

    .nav-right{
      display:none;
      width:100%;
      flex-direction:column;
      align-items:flex-start;
      gap:12px;
      padding-top:10px;
      border-top:1px solid var(--border);
    }

    .nav-right.open{display:flex;}

    .menu-toggle{display:block;}
  }
</style>
</head>

    const p =

    p.textContent =
      block.text;

    aboutEl.appendChild(p);

  }

  else if (block.type === "heading") {

    const h =
      document.createElement('h2');

    h.className =
      "section-heading";

    h.textContent =
      block.text;

    aboutEl.appendChild(h);

  }

  else if (block.type === "subheading") {

    const h =
      document.createElement('h3');

    h.className =
      "sub-heading";

    h.textContent =
      block.text;

    aboutEl.appendChild(h);

  }

  else if (block.type === "list") {

      document.createElement('ul');

    ul.className =
      "bullets";

    block.items.forEach(it => {

      const li =
        document.createElement('li');

      li.textContent =

/* ============================================================
   WRITING & REPORTING
   ============================================================ */

const projectsEl =
  document.getElementById('projects-list');


CONFIG.projects.forEach(p => {

  const div =
    document.createElement('div');

  div.className =
    'item';


  const linksHtml =
    (p.links || [])

      .filter(
        l =>
          l.url &&
          l.url.trim() !== ""
      )

      .map(
        l =>
          `<a href="${l.url}"
              target="_blank"
              rel="noopener">
              ${l.label}
           </a>`
      )

      .join('');


  div.innerHTML = `

    <h3 style="font-size:16px; font-weight:700; margin-bottom:4px;">
      ${p.title}
    </h3>

    <div class="meta">
      ${p.meta}
    </div>

    <div class="desc">
      ${p.description}
    </div>

    ${
      linksHtml
      ?
      `<div class="links">${linksHtml}</div>`
      :
      ''
    }

  `;


  projectsEl.appendChild(div);

});


/* ============================================================
   AUDIO & MEDIA
   ============================================================ */

const galleryEl =
  document.getElementById('gallery-list');


CONFIG.gallery.forEach(group => {

  const heading =
    document.createElement('h2');

  heading.className =
    'section-heading';

  heading.textContent =
    group.category;

  galleryEl.appendChild(heading);


  const grid =
    document.createElement('div');

  grid.className =
    'gallery-grid';


  group.images.forEach(img => {

    const cell =
      document.createElement('div');

    cell.className =
      'gallery-cell';


    if (
      img.src &&
      img.src.trim() !== ""
    ) {

      cell.innerHTML =
        `<img src="${img.src}"
              alt="${img.caption || group.category}">`;

    }

    else {

      cell.innerHTML =
        `<div class="gallery-placeholder">
           Coming Soon
         </div>`;

    }


    if (
      img.caption &&
      img.caption.trim() !== ""
    ) {

      const cap =
        document.createElement('div');

      cap.className =
        'gallery-caption';

      cap.textContent =
        img.caption;

      cell.appendChild(cap);

    }


    grid.appendChild(cell);

  });


  galleryEl.appendChild(grid);

});


/* ============================================================
   CV
   ============================================================ */

document.getElementById('cv-view-btn').href =
  CONFIG.cv.fileUrl;

document.getElementById('cv-download-btn').href =
  CONFIG.cv.fileUrl;

document.getElementById('cv-updated').textContent =
  "Last updated: " +
  CONFIG.cv.lastUpdated;


/* ============================================================
   CONTACT
   ============================================================ */

const contactEl =
  document.getElementById('contact-list');


CONFIG.contact.forEach(c => {

  const li =
    document.createElement('li');


  if (
    c.url &&
    c.url.trim() !== ""
  ) {

    li.innerHTML =
      `<span class="label">
        ${c.label}
       </span>
       <a href="${c.url}"
          target="_blank"
          rel="noopener">
          ${c.value}
       </a>`;

  }

  else {

    li.innerHTML =
      `<span class="label">
        ${c.label}
       </span>
       ${c.value}`;

  }


  contactEl.appendChild(li);

});


/* ============================================================
   PAGE NAVIGATION
   ============================================================ */

const navButtons =
  document.querySelectorAll('.nav-right button');

const pages =
  document.querySelectorAll('.page');


navButtons.forEach(btn => {

  btn.addEventListener('click', () => {

    const target =
      btn.getAttribute('data-page');


    pages.forEach(p =>
      p.classList.remove('active')
    );


    document
      .getElementById('page-' + target)
      .classList.add('active');


    navButtons.forEach(b =>
      b.classList.remove('active')
    );


    btn.classList.add('active');


    document
      .getElementById('nav-right')
      .classList.remove('open');


    window.scrollTo(0,0);

  });

});


/* ============================================================
   MOBILE MENU
   ============================================================ */

document
  .getElementById('menu-toggle')
  .addEventListener('click', () => {

    document
      .getElementById('nav-right')
      .classList.toggle('open');

  });

</script>
